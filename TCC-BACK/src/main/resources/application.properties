spring.application.name=agromotor

# Banco de dados (sobrescreva por variáveis de ambiente no Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agromotor}
spring.datasource.username=${DB_USER:agromotor}
spring.datasource.password=${DB_PASSWORD:agromotor}

# O esquema pertence ao Flyway; o Hibernate apenas valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# JSON: números decimais sempre por extenso (80.00, nunca 8E+1)
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.generator.write-bigdecimal-as-plain=true

server.error.include-message=never
server.error.include-stacktrace=never

# Origens permitidas pelo CORS (ng serve em desenvolvimento)
app.cors.origens=${CORS_ORIGINS:http://localhost:4200}

# JWT: sem segredo definido, a aplicação gera um aleatório a cada inicialização
app.jwt.segredo=${JWT_SECRET:}
app.jwt.expiracao-minutos=${JWT_EXPIRATION_MINUTES:480}

# Primeiro administrador: criado na inicialização se ambos forem informados
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_PASSWORD:}

# Documentação da API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
